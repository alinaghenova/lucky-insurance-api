openapi: 3.0.0
info:
  title: API сервиса Lucky Insurance
  description: >-
    Коллекция запросов API сервиса. Сервис предоставляет информацию о страховках для животных.
  version: 1.0.1
  contact:
    name: LuckyFilms API
    url: https://lucky.com
    email: LuckyFilms@lucky.com
  termsOfService: https://lucky.com
  license:
    name: license 1.0.1 Lucky
    url: https://lucky.com
servers:
  - url: https://pstmn.io
    description: Lucky Mock Server
tags:
  - name: Insurance Server API
paths:
  /insurance:
    get:
      tags:
        - Insurance Server API
      summary: Описание всех страховок для животных
      description: Возвращает полный список доступных страховок пользователя без ограничений.
      operationId: insuranceList
      responses:
        '200':
          description: Список страховок 
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
                    description: Описание условий страхового полиса
                    example: Помощь ветеринара 24/7. Онлайн консультации. Большой выбор ветклиник.
                  insurances:
                    type: array
                    items:
                      $ref: '#/components/schemas/response_200'
        '400':
          description: Некорректный запрос (неверные параметры)
        '401':
          description: Пользователь не авторизован
        '500':
          description: Внутренняя ошибка сервера
components:
  schemas:
    response_200:
      type: object
      required:
        - id
        - title
        - price
      properties:
        id:
          type: string
          format: uuid
          example: d3b07384-d113-4956-a5cc-484194581d43
        title:
          type: string
          example: Базовая страховка
        petType: 
          type: string
          description: Тип питомца, для которого предназначена страховка (cat или dog)
          example: cat
        features:
          type: array
          description: Массив преимуществ программы страхования
          items:
            type: string
          example: ["Помощь ветеринара 24/7", "Онлайн-консультации"]
        price:
          type: integer
          description: Стоимость страхового полиса
          example: 35000
        currency:
          type: string
          description: Валюта оплаты
          example: RUB
        period:
          type: string
          description: Период действия страховки
          example: year
